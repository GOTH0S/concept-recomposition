name: market-appendix

on:
  pull_request:
    paths:
      - "src/concept_recomposition/market_appendix.py"
      - "src/concept_recomposition/search.py"
      - "src/concept_recomposition/grammar.py"
      - ".github/workflows/market-appendix.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"
      - run: python -m concept_recomposition.market_appendix
      - name: Check frozen market artifact
        run: git diff --ignore-space-at-eol --exit-code -- results/market_appendix.csv
      - uses: actions/upload-artifact@v4
        with:
          name: market-appendix-results
          path: results/market_appendix.csv
