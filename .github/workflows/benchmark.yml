name: benchmark

on:
  pull_request:
    paths:
      - "src/concept_recomposition/**"
      - "tests/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"
      - run: python -m concept_recomposition.reproduce
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/summary.csv
            results/headline.csv
            results/lineage.json
            figures/*.svg
      - name: Check frozen benchmark artifacts
        run: git diff --ignore-space-at-eol --exit-code -- results/headline.csv results/lineage.json figures/*.svg
